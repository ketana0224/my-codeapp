name: Code App deployment

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Approved full commit SHA (must match the selected main revision)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: codeapp-deploy-7a457b55-1919-ef9c-8b65-ca3c03926d14-024f9390-23bd-404e-9e48-062a7e253409
  cancel-in-progress: false

jobs:
  validate:
    name: Validate approved source
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check approved revision
        env:
          APPROVED_SHA: ${{ inputs.source_sha }}
        run: |
          if ($env:GITHUB_REF -cne 'refs/heads/main') {
            throw 'Deployment is allowed only from main.'
          }
          if ($env:APPROVED_SHA -cnotmatch '^[0-9a-f]{40}$' -or $env:APPROVED_SHA -cne $env:GITHUB_SHA) {
            throw 'Provide the full approved SHA matching this main revision.'
          }
      - name: Check out approved source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify checkout
        run: |
          $actual = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $actual -cne $env:GITHUB_SHA) {
            throw 'Checkout does not match the approved source.'
          }
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Test application and workflow safety
        run: npm test
      - name: Lint application source
        run: npm run lint
      - name: Build and type-check
        run: npm run build
      - name: Check existing application target
        run: npm run predeploy

  deploy:
    name: Publish existing Code App
    needs: validate
    environment: codeapp-development
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out approved source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify checkout
        run: |
          $actual = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $actual -cne $env:GITHUB_SHA) {
            throw 'Checkout does not match the approved source.'
          }
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Build the approved source without deployment credentials
        run: npm run build
      - name: Check existing application target
        run: npm run predeploy
      - name: Publish and confirm existing application
        env:
          PA_CLI_USE_SP_AUTH: 'true'
          PA_CLI_SP_CLIENT_ID: ${{ vars.PA_CLI_SP_CLIENT_ID }}
          PA_CLI_SP_CLIENT_SECRET: ${{ secrets.PA_CLI_SP_CLIENT_SECRET }}
          PA_CLI_SP_TENANT_ID: ${{ vars.PA_CLI_SP_TENANT_ID }}
        run: |
          $clientId = [guid]::Empty
          if (-not [guid]::TryParse($env:PA_CLI_SP_CLIENT_ID, [ref]$clientId) -or $clientId -eq [guid]::Empty) {
            throw 'Configure the service principal client ID in Environment variables.'
          }
          if ([string]::IsNullOrWhiteSpace($env:PA_CLI_SP_CLIENT_SECRET)) {
            throw 'Configure the service principal client secret in Environment secrets.'
          }
          if ($env:PA_CLI_SP_TENANT_ID -cne '655bd66a-5001-4cb3-9aad-ce54a27d5d95') {
            throw 'The configured tenant does not match the approved target.'
          }
          $version = npx --no-install pa --version
          if ($LASTEXITCODE -ne 0 -or $version.Trim() -cne '1.3.0') {
            throw 'The approved Power Apps CLI version is 1.3.0.'
          }
          npx --no-install pa app push --non-interactive
          if ($LASTEXITCODE -ne 0) {
            throw 'Publication failed. Inspect the target before deciding whether to retry.'
          }
          $apps = npx --no-install pa app list --non-interactive --json
          if ($LASTEXITCODE -ne 0) {
            throw 'Publication completed, but the application list could not be verified. Do not retry publication blindly.'
          }
          if (($apps -join "`n") -notmatch '024f9390-23bd-404e-9e48-062a7e253409') {
            throw 'Publication completed, but the expected application was not found. Inspect the target before retrying.'
          }
          "Published source: $env:GITHUB_SHA" >> $env:GITHUB_STEP_SUMMARY
          'Confirmed app: 024f9390-23bd-404e-9e48-062a7e253409' >> $env:GITHUB_STEP_SUMMARY
          'Publication and app existence confirmed. Browser smoke testing is a separate step.' >> $env:GITHUB_STEP_SUMMARY
