name: Code App CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeapp-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Code App
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Test application and workflow safety
        run: npm test
      - name: Lint application source
        run: npm run lint
      - name: Build and type-check
        run: npm run build
      - name: Run checks without publishing
        run: npm run predeploy
